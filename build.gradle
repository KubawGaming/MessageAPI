plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '8.3.3'
}

group = 'me.kubaw208'
version = '0.3.2'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        url = uri("https://jitpack.io")
    }
    maven { // placeholderapi repository
        url = 'https://repo.extendedclip.com/releases/'
    }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:1.17-R0.1-SNAPSHOT"
    compileOnly 'org.projectlombok:lombok:1.18.44'
    compileOnly 'me.clip:placeholderapi:2.12.3'

    annotationProcessor 'org.projectlombok:lombok:1.18.44'

    implementation 'net.kyori:adventure-platform-bukkit:4.4.1'
    implementation "net.kyori:adventure-text-minimessage:4.26.1"
    implementation "net.kyori:adventure-text-serializer-plain:4.26.1"

    implementation 'com.github.KubawGaming:BetterRunnableAPI:v7.0.0'
    implementation 'de.exlll:configlib-paper:4.5.0'
    implementation 'de.exlll:configlib-yaml:4.5.0'
    api 'tools.jackson.core:jackson-databind:3.1.2'
}

def targetJavaVersion = 17
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    withSourcesJar()
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

publishing {
    publications {
        gpr(MavenPublication) {
            artifactId = "messageapi"
            from(components.java)
        }
    }
}

shadowJar {
    if (project.hasProperty('shadowJar_destinationDirectory')) {
        destinationDirectory.set(file(getProperty('shadowJar_destinationDirectory')))
    }

    relocate "net.kyori", "me.kubaw208.messageapi.libs.kyori"

    archiveFileName = "${project.name}.jar"
    exclude "hotswap-agent.properties"
}